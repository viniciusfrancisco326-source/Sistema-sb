<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema Sou Bela - Expedição</title>
  <link rel="stylesheet" href="style.css?v=5.0">
  <link rel="icon" type="image/png" href="Sou Bela -logo (3).png?v=1.0">
  
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  
  <style>
    /* CORES DINÂMICAS POR STATUS */
    .status-nao-visualizado { background: #fef2f2 !important; border-left: 6px solid #ef4444 !important; }
    .status-visualizado { background: #eff6ff !important; border-left: 6px solid #3b82f6 !important; }
    .status-em-separacao { background: #fefce8 !important; border-left: 6px solid #eab308 !important; }
    .status-falta-peca { background: #fff7ed !important; border-left: 6px solid #f97316 !important; }
    .status-separado { background: #f0fdf4 !important; border-left: 6px solid #22c55e !important; }
    
    .status-indicator-badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .badge-nao-visualizado { background: #fee2e2; color: #991b1b; }
    .badge-visualizado { background: #dbeafe; color: #1e40af; }
    .badge-em-separacao { background: #fef08a; color: #854d0e; }
    .badge-falta-peca { background: #ffedd5; color: #9a3412; }
    .badge-separado { background: #dcfce7; color: #166534; }

    .editado-aviso-box {
      background: rgba(255, 255, 255, 0.7);
      border: 1px dashed #b61e6b;
      color: #b61e6b;
      padding: 6px 10px;
      font-size: 11px;
      font-weight: bold;
      border-radius: 6px;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <div id="loginScreen" class="login-container">
    <div class="login-card">
      <img src="Sou bela -logo.png" alt="Logo Sou Bela" class="login-logo">
      <h2>Acesso ao Sistema</h2>
      
      <div class="field">
        <label for="perfilLogin">Quem está acessando?</label>
        <select id="perfilLogin">
          <option value="dono">Dono / Vendedor</option>
          <option value="expedicao">Expedição</option>
        </select>
      </div>

      <div class="field" id="boxSelecionarNome">
        <label for="nomeVendedorSelect">Selecione seu Nome</label>
        <select id="nomeVendedorSelect">
          <option value="Fabio">Fábio</option>
          <option value="Dona Lene">Dona Lene</option>
        </select>
      </div>

      <button id="btnEntrar" class="btn-primary" style="width: 100%; padding: 14px; font-size: 16px; font-weight: 800; margin-top: 10px;">Entrar no Sistema</button>
      <button id="btnAtivarNotificacoesLogin" style="background: #e5e7eb !important; color: #4b5563 !important; box-shadow: none !important; margin-top: 15px; font-size: 12px; padding: 8px; font-weight: 600; width:100%; border:none; border-radius:8px; cursor:pointer;">🔔 Configurar Notificações Push</button>
    </div>
  </div>

  <div id="dashboardDono" class="shell" style="display: none;">
    <div class="page">
      <div class="hero">
        <div>
          <h1>Painel do Vendedor</h1>
          <p>Olá, <span id="lblDonoNome">...</span>! Cadastre e acompanhe seus pedidos.</p>
        </div>
        <div style="display: flex; gap: 10px; align-items: center;">
          <button id="btnAtivarNotificacoesDono" style="background: #e5e7eb !important; color: #4b5563 !important; font-size: 12px; padding: 8px 12px; box-shadow: none !important; margin: 0; border:none; border-radius:8px; cursor:pointer;">🔔 Ativar Notificações</button>
          <button id="btnSairDono" class="btn-danger">Sair</button>
        </div>
      </div>

      <div class="layout-grid">
        <div class="card">
          <h3 id="tituloFormPedido">📦 Enviar Novo Pedido</h3>
          <form id="formNovoPedido">
            <input type="hidden" id="editPedidoId" value="">

            <div class="field">
              <label>Nome do Cliente</label>
              <input type="text" id="cliente" placeholder="Ex: Maria José">
            </div>
            <div class="grid-2">
              <div class="field">
                <label>Estado</label>
                <select id="estado">
                  <option value="CE">Ceará (CE)</option>
                  <option value="MA">Maranhão (MA)</option>
                  <option value="PI">Piauí (PI)</option>
                  <option value="RN">Rio Grande do Norte (RN)</option>
                </select>
              </div>
              <div class="field">
                <label>Cidade</label>
                <input type="text" id="cidade" placeholder="Ex: Fortaleza">
              </div>
            </div>

            <div class="divider"></div>
            <h4>Peças do Pedido</h4>
            <div id="pedidoComposerBlocks"></div>
            <button type="button" id="btnAddModelRow" class="btn-secondary" style="margin-top:10px;">➕ Adicionar Outro Modelo</button>

            <div class="field" style="margin-top:15px;">
              <label>Observações / Detalhes Gerais</label>
              <textarea id="obsPedido" rows="3" placeholder="Alguma observação extra sobre a entrega..."></textarea>
            </div>

            <div class="form-buttons">
              <button type="submit" id="btnSubmitPedido" class="btn-primary flex-1">Enviar para Expedição</button>
              <button type="button" id="btnCancelarEdicao" class="btn-danger" style="display:none;">Cancelar Edição</button>
              <button type="button" id="btnExemplo" class="btn-secondary">Preencher Exemplo</button>
            </div>
          </form>
        </div>

        <div class="card">
          <h3>📋 Meus Pedidos Enviados</h3>
          <div id="listaPedidosDono" class="pedidos-container"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="dashboardExpedicao" class="shell" style="display: none;">
    <div class="page">
      <div class="hero">
        <div>
          <h1>Setor de Expedição 🚚</h1>
          <p>Gerencie a fila de separação de mercadorias em tempo real.</p>
        </div>
        <div style="display: flex; gap: 10px; align-items: center;">
          <button id="btnAtivarNotificacoesExp" style="background: #e5e7eb !important; color: #4b5563 !important; font-size: 12px; padding: 8px 12px; box-shadow: none !important; margin: 0; border:none; border-radius:8px; cursor:pointer;">🔔 Ativar Notificações</button>
          <button id="btnSairExp" class="btn-danger">Sair</button>
        </div>
      </div>

      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-num" id="statTotalExp">0</div>
          <div class="stat-label">Total Geral</div>
        </div>
        <div class="stat-card status-pendente">
          <div class="stat-num" id="statPendExp">0</div>
          <div class="stat-label">Fila de Espera</div>
        </div>
        <div class="stat-card status-separado">
          <div class="stat-num" id="statSepExp">0</div>
          <div class="stat-label">Concluídos</div>
        </div>
      </div>

      <div class="filter-bar">
        <div class="field flex-1">
          <input type="text" id="searchExp" placeholder="🔎 Buscar por cliente, vendedor, cidade...">
        </div>
        <div class="field" style="min-width: 200px;">
          <select id="filterStatus">
            <option value="all">Todos os Status</option>
            <option value="nao-visualizado">Não visualizado</option>
            <option value="visualizado">Visualizado</option>
            <option value="em-separacao">Em separação</option>
            <option value="falta-peca">Falta peça</option>
            <option value="separado">Separado (Concluído)</option>
          </select>
        </div>
      </div>

      <div id="listaPedidosExp" class="pedidos-container unified-exp">
        <div class="empty">Carregando dados...</div>
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
